name: pingapp-dev

x-app: &app
  build:
    context: .
    target: dev
  working_dir: /app
  volumes:
    - .:/app
  env_file:
    - ../docs/deploy/backend.env.dev
  restart: unless-stopped

services:
  anvil:
    profiles: ["fork"]
    image: ghcr.io/foundry-rs/foundry:v1.5.1
    entrypoint: anvil
    command: ["--host", "0.0.0.0", "--port", "8545", "--chain-id", "4663", "--fork-url", "${FORK_RPC_URL:-}", "--fork-block-number", "${FORK_BLOCK:-86069831}", "--silent"]
    ports:
      - 127.0.0.1:7445:8545
    restart: "no"

  postgres:
    image: postgres:17-alpine
    env_file:
      - ../docs/deploy/backend.env.dev
    environment:
      POSTGRES_USER: pingapp
      POSTGRES_DB: pingapp
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:7432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pingapp -d pingapp"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata-dev:/data
    ports:
      - 127.0.0.1:7479:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["npx", "tsx", "src/db/migrate.ts"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    command: ["npm", "run", "dev"]
    ports:
      - 127.0.0.1:7410:8080
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *app
    command: ["npm", "run", "dev:worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata-dev:
  redisdata-dev:
