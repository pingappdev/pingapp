[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
# 2026-10-11: mainnet eth_call --create 0x5f5ff3 returned 0x (PUSH0 supported).
evm_version = "shanghai"

[profile.default.fuzz]
runs = 5000

[profile.default.invariant]
runs = 256
depth = 64

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
