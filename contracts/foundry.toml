[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 10000
# 2026-10-11: mainnet eth_call --create 0x5f5ff3 returned 0x (PUSH0 supported).
evm_version = "shanghai"

[profile.default.fuzz]
runs = 5000

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = true

# CI records a deeper, seeded campaign with sequence IDs; exact traces vary between runs.
[profile.ci.invariant]
runs = 1024
depth = 128
fail_on_revert = true
failure_persist_dir = "/ci-runtime/cache/invariant/failures"

[[profile.ci.fs_permissions]]
access = "read-write"
path = "/ci-runtime/evidence"

[rpc_endpoints]
robinhood = "${ROBINHOOD_RPC_URL}"
